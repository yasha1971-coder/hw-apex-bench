name: Stage 1 three-codec verification
on:
  pull_request:
    paths:
      - 'run.sh'
      - 'codecs/**'
      - 'harness/**'
      - 'corpora.json'
      - 'protocol.json'
      - '.github/workflows/stage1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build and htslib dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 pkg-config libhts-dev tabix zlib1g-dev
      - name: Run the first-table stage
        run: bash run.sh > benchmark.log 2>&1
      - name: Show complete log
        if: always()
        run: cat benchmark.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-evidence
          if-no-files-found: error
          include-hidden-files: true
          path: |
            results.jsonl
            README.md
            benchmark.log
            .work/metadata.json
            .work/archives.json
            .work/samples-*.jsonl
