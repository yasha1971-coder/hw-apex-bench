name: ACEAPEX v2.1.0 and open refresh
# Manual-only after verified CPU refresh run 36641590388.
# PR synchronization must not repeat the 600-archive / 360,000-region measurement.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  adapters-and-gpu-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install adapter build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git python3 zlib1g-dev
      - name: Qualify v2.1.0 interactive adapter
        run: ./run.sh --check codecs/aceapex.sh --work .work/modern-check
      - name: Qualify current-main open adapter
        run: ./run.sh --check codecs/aceapex_open.sh --work .work/modern-check
      - name: Verify imported GPU evidence
        run: python3 review/aceapex_upgrade/check_gpu_import.py
      - name: Retain adapter receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aceapex-modern-adapter-receipts
          path: |
            .work/modern-check/**/check.json
            .work/modern-check/**/check.log

  cpu-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake git zlib1g-dev curl python3
      - name: Download and verify T2T-CHM13v2.0
        run: |
          mkdir -p .work/source
          curl --fail --location --retry 3 \
            https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/009/914/755/GCA_009914755.4_T2T-CHM13v2.0/GCA_009914755.4_T2T-CHM13v2.0_genomic.fna.gz \
            -o .work/source/t2t.fna.gz
          echo '9280657210e4161147cbe13b022225b9  .work/source/t2t.fna.gz' | md5sum -c -
          gzip -dc .work/source/t2t.fna.gz > .work/source/t2t.fa
          test "$(stat -c%s .work/source/t2t.fa)" = 3156259565
          echo 'cd1e52ce400c027ed0b7ab4b9d613f5a  .work/source/t2t.fa' | md5sum -c -
      - name: Recreate exact frozen thirty windows
        run: |
          python3 review/t2t_regions/prepare.py \
            --fasta .work/source/t2t.fa \
            --report evidence/t2t-regions-20260916/GCA_009914755.4_T2T-CHM13v2.0_assembly_report.txt \
            --censat evidence/t2t-regions-20260916/chm13v2.0_censat_v2.1.bed \
            --telomeres evidence/t2t-regions-20260916/chm13v2.0_telomere.bed \
            --out .work/windows
          rm -f .work/source/t2t.fa .work/source/t2t.fna.gz
      - name: Download and verify hg38 chr1
        run: |
          curl --fail --location --retry 3 \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr1.fa.gz \
            -o .work/source/chr1.fa.gz
          gzip -dc .work/source/chr1.fa.gz > .work/source/chr1.fa
          rm .work/source/chr1.fa.gz
          test "$(stat -c%s .work/source/chr1.fa)" = 253935557
          echo '9465e0f0df6e2c6eb39729c39cee5465  .work/source/chr1.fa' | md5sum -c -
      - name: Build exact pinned codec bundle
        run: bash review/aceapex_upgrade/build.sh .work/build .work/native
      - name: Show exact pins
        run: cat .work/native/PINS
      - name: Run same-machine matched-g and open c(g)
        run: |
          python3 review/aceapex_upgrade/run_cpu.py \
            --inputs .work/windows \
            --chr1 .work/source/chr1.fa \
            --native .work/native \
            --out /tmp/aceapex-upgrade \
            --actions-run-id "$GITHUB_RUN_ID"
      - name: Show report
        run: cat /tmp/aceapex-upgrade/REPORT.md
      - name: Retain CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aceapex-v210-open-cpu-refresh
          path: |
            /tmp/aceapex-upgrade/results.json
            /tmp/aceapex-upgrade/REPORT.md
            /tmp/aceapex-upgrade/matched-g/results.json
            /tmp/aceapex-upgrade/matched-g/samples.jsonl
            /tmp/aceapex-upgrade/matched-g/g*/result.json
            /tmp/aceapex-upgrade/matched-g/g*/configurations.json
            /tmp/aceapex-upgrade/open-cg/result.json
            .work/native/PINS
            .work/native/SHA256SUMS
