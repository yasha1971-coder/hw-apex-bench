name: v0.2.0 verified static results
on:
  pull_request:
    paths: ['tools/**', 'schemas/**', 'tests/**', 'METHODOLOGY.md', 'CITATION.cff', '.zenodo.json', 'CHANGELOG.md', 'RELEASE_NOTES_v0.2.0.md', 'review/axis3/**', 'docs/SITE.md', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['tools/**', 'schemas/**', 'tests/**', 'METHODOLOGY.md', 'CITATION.cff', '.zenodo.json', 'CHANGELOG.md', 'RELEASE_NOTES_v0.2.0.md', 'review/axis3/**', 'docs/SITE.md', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.deploy-gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned offline-builder prerequisites
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/python" -m pip install \
            jsonschema==4.26.0 PyYAML==6.0.3 html5lib==1.1 Markdown==3.8.2
      - name: Verify synthetic release, build site, check HTML and exact golden bytes
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/site-venv/bin/python" -m tools.site_synthetic \
            --out "$RUNNER_TEMP/site-acceptance"
      - name: Retain PR and main evidence, release and static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v020-site-synthetic
          path: ${{ runner.temp }}/site-acceptance
          if-no-files-found: error
          include-hidden-files: true
      - name: Deploy gate - only a release with measured or official evidence replaces the public homepage
        id: deploy-gate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/site-venv/bin/python" -m tools.pages_deploy_gate \
            "$RUNNER_TEMP/site-acceptance/first" --github-output "$GITHUB_OUTPUT"
      - name: Package Pages artifact only on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.deploy-gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/site-acceptance/first
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.deploy == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
