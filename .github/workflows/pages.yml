name: Publish benchmark homepage
on:
  push:
    branches: [main]
    paths: ['web/**', 'results.jsonl', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate from committed measurements
        run: python3 web/build.py .pages/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Deploy public homepage
        id: deployment
        uses: actions/deploy-pages@v4
