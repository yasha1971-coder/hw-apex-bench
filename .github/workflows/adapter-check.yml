name: Four codec adapter checks
on:
  pull_request:
    paths:
      - 'codecs/**'
      - 'harness/check*'
      - 'harness/resident*'
      - 'harness/context-ace-sources.json'
      - 'harness/verify_context_sources.py'
      - 'harness/test_check_adapter.py'
      - 'run.sh'
      - '.github/workflows/adapter-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        codec: [bgzip, zstd_seekable, aceapex, xz]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake zlib1g-dev
      - name: Check failure handling and external adapter
        run: python3 -m unittest discover -s harness -p test_check_adapter.py
      - name: Build and check the adapter on small corpora
        run: ./run.sh --check "codecs/${{ matrix.codec }}.sh"
      - name: Retain receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-check-${{ matrix.codec }}
          path: |
            .work/adapter-check/**/check.json
            .work/adapter-check/**/check.log
          include-hidden-files: true
