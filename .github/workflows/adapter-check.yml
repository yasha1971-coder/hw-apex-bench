name: Four codec adapter checks
on:
  pull_request:
    paths:
      - 'codecs/**'
      - 'harness/check*'
      - 'harness/qualification.py'
      - 'harness/axis_planner.py'
      - 'harness/native_measure.c'
      - 'harness/native_execution.py'
      - 'harness/adapter_*.py'
      - 'harness/native_*.py'
      - 'harness/native_batch.c'
      - 'harness/reader_environment.py'
      - 'review/verify_nine_axes.py'
      - 'harness/test_native_execution.py'
      - 'harness/test_axis_planner.py'
      - 'harness/resident*'
      - 'harness/context-ace-sources.json'
      - 'harness/verify_context_sources.py'
      - 'harness/test_check_adapter.py'
      - 'run.sh'
      - '.github/workflows/adapter-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      measure: ${{ steps.scope.outputs.measure }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Select timing checks only for measurement implementation changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY_SCOPE'
          import json, os, subprocess
          from pathlib import Path
          # Correctness checks always run. Timing smoke tests must not repeat
          # the already successful v2.2 implementation during publication-only
          # synchronization. Other PRs retain the original full-PR scope.
          measure = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          if not measure:
              compare_base = os.environ['BASE_SHA']
              frozen = Path('evidence/aceapex-v220-cpu-20260930/receipt.json')
              if os.environ['HEAD_REF'] == 'upgrade/aceapex-v220' and frozen.is_file():
                  receipt = json.loads(frozen.read_text())
                  expected = 'a22075e3f3b51a012bb6dff34d5e5643e43e428f'
                  if receipt['run_id'] == 36751391857 and receipt['run_head_sha'] == expected:
                      compare_base = expected
                      print('Compare implementation against successful frozen run 36751391857')
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', compare_base,
                  os.environ['HEAD_SHA'], '--'
              ], text=True).splitlines()
              measure = any(
                  p.startswith('codecs/') or
                  (p.startswith('harness/') and p != 'harness/test_entrypoints.py') or
                  p in ('review/verify_nine_axes.py',
                        'review/aceapex_upgrade/adapter_common.sh',
                        'review/aceapex_v220/build.sh',
                        'review/aceapex_v220/build_counter.py',
                        'review/aceapex_v220/run.py') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('measure=' + str(measure).lower() + '\n')
          print('Run timing checks:', measure)
          PY_SCOPE
  check:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        codec: [bgzip, bgzip_1_19, zstd_seekable, aceapex, aceapex_dense, xz]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential autoconf automake cmake zlib1g-dev
      - name: Check failure handling and external adapter
        run: python3 -m unittest discover -s harness -p test_check_adapter.py
      - name: Check eligibility and capability dispatch
        run: python3 -m unittest discover -s harness -p test_axis_planner.py
      - name: Check native worker failure handling and workload
        if: needs.scope.outputs.measure == 'true'
        run: python3 -m unittest discover -s harness -p test_native_execution.py
      - name: Check counter, batch and reader parameter regression
        if: needs.scope.outputs.measure == 'true'
        run: python3 -m unittest discover -s harness -p test_native_methods.py
      - name: Build and check the adapter on small corpora
        run: ./run.sh --check "codecs/${{ matrix.codec }}.sh"
      - name: Plan axes from the fresh receipt without measuring
        run: ./run.sh --plan --codec "${{ matrix.codec }}" --output ".work/${{ matrix.codec }}.plan.json"
      - name: Exercise native dispatch on the small corpus
        if: needs.scope.outputs.measure == 'true' && github.head_ref != 'tooling/bgzf-build-audit'
        run: |
          python3 harness/resident_fixture.py .work/native-input
          python3 -c 'from pathlib import Path; p=Path(".work/native-input");p.write_bytes(p.read_bytes()*4)'
          ./run.sh --measure --codec "${{ matrix.codec }}" --axis ratio --axis encode --axis decode --axis region --axis amplification --axis batch --axis h_alpha --axis c_g --axis break_even --plateau --copies 1,2,4 --batch-sizes 100 --input .work/native-input --output-dir ".work/native-${{ matrix.codec }}"
      - name: Audit all nine axes and generated records
        if: needs.scope.outputs.measure == 'true' && github.head_ref != 'tooling/bgzf-build-audit'
        run: python3 review/verify_nine_axes.py ".work/native-${{ matrix.codec }}/manifest.json"
      - name: Retain receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adapter-check-${{ matrix.codec }}
          path: |
            .work/adapter-check/**/check.json
            .work/adapter-check/**/check.log
            .work/*.plan.json
            .work/native-*/manifest.json
            .work/native-*/results.jsonl
            .work/native-*/README.md
            .work/native-*/**/*.jsonl
            .work/native-*/**/*.log
          include-hidden-files: true

  full-native-comparison:
    # Owner authorized one full run after all small checks. Never repeat it on
    # documentation updates, PR synchronize, or unrelated adapter PRs.
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'tooling/native-remaining-axes'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential autoconf automake cmake zlib1g-dev
      - name: Run the authorized full native comparison
        run: python3 harness/full_native_run.py
      - name: Preserve full candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-full-comparison
          include-hidden-files: true
          path: |
            .work/native-full/**/*.json
            .work/native-full/**/*.md
            .work/native-full/**/*.jsonl
            .work/native-full/**/*.ranges
            .work/native-full/**/*.log
            .work/adapter-check/**/check.json
            .work/adapter-check/**/check.log
