name: New axes contract checks
on:
  pull_request:
    paths:
      - 'regions/**'
      - 'harness/corruption.py'
      - 'harness/region_latency.py'
      - 'harness/test_corruption.py'
      - 'review/new_axes_20261002/**'
      - '.github/workflows/new-axes-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test deterministic corruption plan
        run: |
          set -euo pipefail
          python3 -m unittest harness/test_corruption.py
      - name: Validate frozen request sets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            "regions/chr1-10000x5000.tsv":"9d392b18edae7f146c124ef9b125120b7bf36ab13f28b43919ca47a67632193f",
            "regions/chr1-10000x5000.sha256.tsv":"aa322f5c5ad2038058b538864a8dcfe7b958f6fd28e12b0cb7b44c2d33debd31",
            "regions/t2t-10000x5000.tsv":"ffcd908681e571524350b84a125440c2cdcb9a277e474e3b37ffc5720b301e96",
            "regions/t2t-10000x5000.sha256.tsv":"9afe989c8d6d2595bf61bcbf4a5f582a8890f06e6e920197e5dee3c29c7420c2",
          }
          for name,want in expected.items():
              p=Path(name); got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want: raise SystemExit(f"{name}: digest mismatch")
              data=[x for x in p.read_text().splitlines() if x and not x.startswith("#")]
              if len(data) != 10001: raise SystemExit(f"{name}: expected header plus 10000 rows")
          print("PASS: frozen region lists and references")
          PY
      - name: Syntax-check explicit ace-core runners
        run: |
          set -euo pipefail
          bash -n review/new_axes_20261002/build_ace_cpu.sh
          bash -n review/new_axes_20261002/build_region_helpers.sh
          bash -n review/new_axes_20261002/run_corruption_ace_core.sh
          bash -n review/new_axes_20261002/run_region_ace_core.sh
          grep -Fq 'ACE_CXXFLAGS="-std=c++17 -O3 -march=native -funroll-loops -DACEAPEX_CLI"' review/new_axes_20261002/build_region_helpers.sh
          grep -Fq 'offset_bytes":104857600' review/new_axes_20261002/run_corruption_ace_core.sh
          grep -Fq 'length_bytes":16777216' review/new_axes_20261002/run_corruption_ace_core.sh
          grep -Fq '"input_path":"chr1-mid-100MiB-16MiB.fa"' review/new_axes_20261002/run_corruption_ace_core.sh
          if grep -Fq '/home/' review/new_axes_20261002/results/ace-core-2026-10-03-c929561/corruption/INPUT_MANIFEST.json; then
            echo 'absolute path leaked into INPUT_MANIFEST.json' >&2
            exit 1
          fi
          grep -Fq '7bd8e0091d0b54895abc5ad9b354ad7d5f7d5883' review/new_axes_20261002/PROTOCOL.md
          python3 -m py_compile harness/corruption.py harness/region_latency.py review/new_axes_20261002/ace_cpu_adapter.py
      - name: Verify ACE C++ shim exports unmangled ABI
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cat > "$tmp/aceapex.h" <<'EOF'
          #include <stdint.h>
          #include <stddef.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          int64_t aceapex_decompress_region(const void*,size_t,void*,size_t,uint64_t,uint64_t);
          #ifdef __cplusplus
          }
          #endif
          EOF
          cat > "$tmp/stub.cpp" <<'EOF'
          #include <stdint.h>
          #include <stddef.h>
          extern "C" int64_t aceapex_decompress_region(const void*,size_t,void*,size_t,uint64_t,uint64_t) { return -2; }
          EOF
          g++ -O2 -std=c++17 -fPIC -shared -I"$tmp" review/new_axes_20261002/ace_cpp_region_shim.cpp "$tmp/stub.cpp" -o "$tmp/shim.so"
          nm -D --defined-only "$tmp/shim.so" | awk '{print $3}' | grep -Fx axcpp_region
          nm -D --defined-only "$tmp/shim.so" | awk '{print $3}' | grep -Fx axcpp_decoder
          python3 - "$tmp/shim.so" <<'PY'
          import ctypes,sys
          lib=ctypes.CDLL(sys.argv[1])
          fn=lib.axcpp_region
          fn.restype=ctypes.c_int64
          fn.argtypes=[ctypes.c_void_p,ctypes.c_size_t,ctypes.c_void_p,ctypes.c_size_t,ctypes.c_uint64,ctypes.c_uint64]
          if fn(None,0,None,0,0,0) != -2:
              raise SystemExit("unexpected shim forwarding result")
          print("PASS: ctypes resolves axcpp_region and forwards through the C ABI")
          PY
      - name: Validate adapter contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("review/new_axes_20261002/adapters").glob("*.json")):
              d=json.loads(p.read_text())
              for k in ("codec","version","checksum_mode","compress","decompress","region"):
                  if k not in d: raise SystemExit(f"{p}: missing {k}")
              if not isinstance(d["compress"],list) or not isinstance(d["decompress"],list):
                  raise SystemExit(f"{p}: commands must be argv arrays")
          print("PASS: adapter contracts")
          PY
