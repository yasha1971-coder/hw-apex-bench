name: perf PMU smoke arm64
on:
  pull_request:
    paths:
      - '.github/workflows/perf-arm-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test hardware PMU exposure
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic
          PERF=$(find /usr/lib /usr/bin -type f -name perf 2>/dev/null | sort | head -1)
          if [ -z "$PERF" ]; then PERF=$(command -v perf || true); fi
          test -n "$PERF"
          "$PERF" --version
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          "$PERF" stat -x ';' -e cycles:u,instructions:u -o /tmp/perf.csv -- /bin/true
          cat /tmp/perf.csv
          ! grep -q '<not supported>' /tmp/perf.csv
