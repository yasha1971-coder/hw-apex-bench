name: README Quick start
on:
  pull_request:
    paths:
      - 'README.md'
      - 'harness/**'
      - 'codecs/**'
      - 'corpora.json'
      - 'run.sh'
      - '.github/workflows/quickstart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Execute README lines verbatim including prerequisites and download
        run: |
          set -euo pipefail
          python3 harness/quickstart.py run 2>&1 | tee quickstart.log
      - name: Retain timings and pick evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quickstart
          include-hidden-files: true
          path: |
            quickstart.log
            .work/quickstart-pick/pick.json
            .work/quickstart-pick/pick.md
            .work/adapter-check/**/check.json
