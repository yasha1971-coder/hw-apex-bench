name: Axis 3 BGZF dual configuration correctness
on:
  pull_request:
    paths:
      - 'review/axis3/bgzf_*'
      - 'review/axis3/build_bgzf_axis3.sh'
      - 'review/axis3/test_bgzf*'
      - '.github/workflows/axis3-bgzf.yml'
      - 'tools/axis4.py'
      - 'tools/axis4_evidence_verify.py'
      - 'tools/axis4_threads*.py'
      - 'schemas/axis4-evidence-v5.schema.json'
permissions:
  contents: read
jobs:
  bgzf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Syntax and production adapter mocks
        run: |
          set -euo pipefail
          python3 -m py_compile review/axis3/*.py
          for f in review/axis3/*.sh; do bash -n "$f"; done
          python3 tools/check_workflow_syntax.py .github/workflows/axis3-bgzf.yml
          python3 -m unittest discover -s review/axis3 -p test_bgzf_adapter.py -v
      - name: Native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool zlib1g-dev samtools cmake
      - name: Restore pinned native build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/axis3-bgzf
          key: axis3-bgzf-4b705e4fada8ee2b6b15746f725ee8ac51631803-dd12ff2b36d603dbb7fa8838fe7e7176fcbd4f6f-${{ runner.os }}-${{ hashFiles('review/axis3/build_bgzf_axis3.sh', 'review/axis3/bgzf_shim.c') }}
      - name: Build existing pinned htslib and libdeflate
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/axis3-bgzf/PINS.txt" &&
             grep -Fxq 'HTS_PIN=4b705e4fada8ee2b6b15746f725ee8ac51631803' "$RUNNER_TEMP/axis3-bgzf/PINS.txt" &&
             grep -Fxq 'DEFLATE_PIN=dd12ff2b36d603dbb7fa8838fe7e7176fcbd4f6f' "$RUNNER_TEMP/axis3-bgzf/PINS.txt" &&
             (cd "$RUNNER_TEMP/axis3-bgzf" && sha256sum -c SHA256SUMS); then
            echo "PINNED_BGZF_CACHE_VERIFIED"
          else
            bash review/axis3/build_bgzf_axis3.sh "$RUNNER_TEMP/axis3-bgzf"
          fi
      - name: Default and matched-g library fetch correctness
        run: |
          set -euo pipefail
          python3 review/axis3/test_bgzf_synthetic.py --bgzip "$RUNNER_TEMP/axis3-bgzf/bgzip" --library "$RUNNER_TEMP/axis3-bgzf/libhwa_bgzf.so" --out "$RUNNER_TEMP/axis3-bgzf-truth"
      - name: B full sequential decode and canonical windows (no timing)
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/axis3-bgzf-truth"
          python3 -m review.axis3.check_verdict_native --family bgzf --variant default \
            --library "$RUNNER_TEMP/axis3-bgzf/libhwa_bgzf.so" \
            --archive "$root/default.bgz" --source "$root/truth.fa"
          for g in 4096 16384 65280; do
            python3 -m review.axis3.check_verdict_native --family bgzf --variant matched-g --granule "$g" \
              --library "$RUNNER_TEMP/axis3-bgzf/libhwa_bgzf.so" \
              --archive "$root/matched-g$g.bgz" --source "$root/truth.fa"
          done
      - name: Axis4 genuine BGZF workers 1 2 8 16 and reordered requests x20
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/axis4-thread-venv"
          "$RUNNER_TEMP/axis4-thread-venv/bin/python" -m pip install -q jsonschema==4.26.0
          "$RUNNER_TEMP/axis4-thread-venv/bin/python" - "$RUNNER_TEMP/axis3-bgzf/libhwa_bgzf.so" "$RUNNER_TEMP/axis4-thread-build.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          library = Path(sys.argv[1])
          receipt = {
              "source_commit": "4b705e4fada8ee2b6b15746f725ee8ac51631803",
              "codec_version": "1.24", "decoder_threads": 1,
              "compiler": "not captured by legacy native build cache",
              "flags": ["-O3", "-fPIC", "-shared"],
              "dependencies": {"htslib": "1.24", "libdeflate_commit": "dd12ff2b36d603dbb7fa8838fe7e7176fcbd4f6f"},
              "library_sha256": hashlib.sha256(library.read_bytes()).hexdigest(),
              "provenance_scope": "synthetic runtime smoke; compiler identity unavailable; not official performance",
              "evidence_kind": "synthetic",
          }
          Path(sys.argv[2]).write_text(json.dumps(receipt, sort_keys=True, indent=2)+chr(10))
          PY
          "$RUNNER_TEMP/axis4-thread-venv/bin/python" -m tools.axis4_threads_fixture \
            --library "$RUNNER_TEMP/axis3-bgzf/libhwa_bgzf.so" \
            --receipt "$RUNNER_TEMP/axis4-thread-build.json" \
            --out "$RUNNER_TEMP/axis4-native-threads"
      - name: Retain native decoder worker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axis4-native-bgzf-threads
          path: ${{ runner.temp }}/axis4-native-threads
          if-no-files-found: error
