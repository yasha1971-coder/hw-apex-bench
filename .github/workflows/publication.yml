name: Committed publication integrity
on:
  pull_request:
    paths:
      - 'results.jsonl'
      - 'README.md'
      - 'docs/BATCH_RESULTS.md'
      - 'docs/AXES_RESULTS.md'
      - 'docs/CG_CURVE_RESULTS.md'
      - 'docs/METHOD.md'
      - 'web/**'
      - 'harness/**'
      - 'evidence/published-results.json'
      - 'evidence/stage5-20260910/**'
      - '.github/workflows/publication.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify mechanical native-code extraction
        run: |
          git fetch --no-tags --depth=1 origin 0e8246f8b14b74191b3bf8cc6f14b71be85779ce
          python3 harness/verify_native_extraction.py
          python3 -m unittest discover -s harness -p test_native_extraction.py
      - name: Reject corrupted evidence
        run: python3 -m unittest discover -s web -p test_publication.py -v
      - name: Audit the nine-axis contract without benchmark execution
        run: |
          python3 -m unittest discover -s harness -p test_axes.py
          python3 -m unittest discover -s harness -p test_cg_curve.py
          ./run.sh --audit-axes
          python3 review/audit_cg_baseline.py --results results.jsonl
          python3 -m unittest discover -s review -p test_cg_baseline.py
          python3 harness/audit_default.py evidence/default-a194893 docs/DEFAULT_RESULTS.md
      - name: Verify committed snapshot and generate homepage
        run: python3 web/build.py .pages/index.html
