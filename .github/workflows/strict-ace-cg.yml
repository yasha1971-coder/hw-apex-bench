name: Strict ACEAPEX c(g) reproduction
on:
  pull_request:
    paths:
      - 'harness/aceapex_strict_cg.py'
      - 'corpora.json'
      - '.github/workflows/strict-ace-cg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-ace-cg:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 pkg-config libzstd-dev
      - name: Run block-size-only pair
        run: |
          set -o pipefail
          ulimit -s
          free -h
          g++ --version
          pkg-config --modversion libzstd
          python3 harness/aceapex_strict_cg.py | tee strict-ace-cg.log
      - name: Diagnose one-block encoder with ASan
        if: failure()
        continue-on-error: true
        run: |
          set -o pipefail
          cd .work/strict-ace-cg/aceapex
          make clean
          make -j2 \
            CXXFLAGS='-std=c++17 -O1 -g -fsanitize=address -fno-omit-frame-pointer' \
            LD='g++ -fsanitize=address'
          env \
            -u LIT_CHUNK -u FSE_CHUNK -u MIN_MATCH -u HASH_LOG \
            -u LIT_LEVEL -u LIT_LANES -u NO_REP -u DIRECT8 \
            -u FORCED_BIN -u ACEAPEX_DUMP -u LD_PRELOAD \
            ASAN_OPTIONS=abort_on_error=1:detect_leaks=0 \
            ACEAPEX_BS=253935557 \
            ./aceapex c --in ../chr1.fa --out ../gall-asan.aet --threads 8 \
            2>&1 | tee ../asan.log
      - name: Show exact archive accounting
        if: always()
        run: |
          test -f .work/strict-ace-cg/claim.json && cat .work/strict-ace-cg/claim.json || true
          test -f .work/strict-ace-cg/failure.json && cat .work/strict-ace-cg/failure.json || true
          test -f .work/strict-ace-cg/g16-compress.log && cat .work/strict-ace-cg/g16-compress.log || true
          test -f .work/strict-ace-cg/gall-compress.log && cat .work/strict-ace-cg/gall-compress.log || true
          test -f .work/strict-ace-cg/asan.log && cat .work/strict-ace-cg/asan.log || true
      - name: Preserve strict claim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-ace-cg-evidence
          if-no-files-found: error
          include-hidden-files: true
          path: |
            strict-ace-cg.log
            .work/strict-ace-cg/claim.json
            .work/strict-ace-cg/failure.json
            .work/strict-ace-cg/commands.txt
            .work/strict-ace-cg/*-compress.log
            .work/strict-ace-cg/*-decompress.log
            .work/strict-ace-cg/build.log
            .work/strict-ace-cg/asan.log
