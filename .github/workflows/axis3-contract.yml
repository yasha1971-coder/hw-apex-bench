name: Axis 3 cohort contracts
on:
  pull_request:
    paths:
      - 'review/axis3/**'
      - '.github/workflows/axis3-contract.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install synthetic adapter dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq samtools tabix
      - name: Create three related mini assemblies
        run: |
          set -euo pipefail
          python3 review/axis3/make_synthetic.py "$RUNNER_TEMP/cohort"
          : > "$RUNNER_TEMP/cohort/manifest.tsv"
          printf 'assembly_id\tlocal_fasta\tsha256\n' >> "$RUNNER_TEMP/cohort/manifest.tsv"
          for f in "$RUNNER_TEMP"/cohort/asm*.fa; do
            samtools faidx "$f"
            id=$(basename "$f" .fa)
            h=$(sha256sum "$f" | cut -d' ' -f1)
            printf '%s\t%s\t%s\n' "$id" "$f" "$h" >> "$RUNNER_TEMP/cohort/manifest.tsv"
          done
      - name: Deterministic window contract and FASTA truth
        run: |
          set -euo pipefail
          for w in 256 4096 65536; do
            python3 review/axis3/generate_windows.py --manifest "$RUNNER_TEMP/cohort/manifest.tsv" --n all --window "$w" --out-prefix "$RUNNER_TEMP/cohort/w$w"
            python3 review/axis3/generate_windows.py --manifest "$RUNNER_TEMP/cohort/manifest.tsv" --n all --window "$w" --out-prefix "$RUNNER_TEMP/cohort/repeat$w"
            cmp "$RUNNER_TEMP/cohort/w$w.tsv" "$RUNNER_TEMP/cohort/repeat$w.tsv"
            cmp "$RUNNER_TEMP/cohort/w$w.sha256.tsv" "$RUNNER_TEMP/cohort/repeat$w.sha256.tsv"
          done
      - name: BGZF adapter bit-perfect synthetic windows
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/cohort/asm*.fa; do bgzip -c "$f" > "$f.bgz"; samtools faidx "$f.bgz"; done
          python3 - "$RUNNER_TEMP/cohort" <<'PY'
          import subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1]); req=root/"w4096.tsv"; out=root/"answers.hex"
          rows=[]
          for line in req.read_text().splitlines():
            if not line or line.startswith("#") or line.startswith("assembly_id"): continue
            a,c,s,e=line.split("\t")
            cp=subprocess.run(["samtools","faidx",str(root/(a+".fa.bgz")),f"{c}:{s}-{e}"],capture_output=True,check=True)
            seq=b"".join(x for x in cp.stdout.splitlines() if not x.startswith(b">"))
            rows.append(seq.hex())
          out.write_text("\n".join(rows)+"\n")
          PY
          python3 review/axis3/judge.py --references "$RUNNER_TEMP/cohort/w4096.sha256.tsv" --answers "$RUNNER_TEMP/cohort/answers.hex" --result "$RUNNER_TEMP/cohort/judge.json"
      - name: Two-bit capacity baseline on synthetic cohort
        run: |
          set -euo pipefail
          python3 review/axis3/two_bit_capacity.py "$RUNNER_TEMP/cohort" > "$RUNNER_TEMP/cohort/two-bit.json"
          grep -Fq '"status": "PASS"' "$RUNNER_TEMP/cohort/two-bit.json"
      - name: Judge must reject corruption
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/cohort/answers.hex" "$RUNNER_TEMP/cohort/bad.hex"
          sed -i '1s/^../00/' "$RUNNER_TEMP/cohort/bad.hex"
          if python3 review/axis3/judge.py --references "$RUNNER_TEMP/cohort/w4096.sha256.tsv" --answers "$RUNNER_TEMP/cohort/bad.hex" --result "$RUNNER_TEMP/cohort/bad.json"; then
            echo 'judge accepted corrupted answer' >&2
            exit 1
          fi
      - name: Refrel3 frozen-v1 q4k/q16k synthetic round-trip
        run: |
          set -euo pipefail
          bash review/axis3/build_refrel3.sh "$RUNNER_TEMP/refrel3"
          export RR3_BIN="$RUNNER_TEMP/refrel3/refrel3v1"
          ref="$RUNNER_TEMP/cohort/asm1.fa"
          for variant in q4k q16k; do
            asm="$RUNNER_TEMP/cohort/asm2.fa"
            arc="$RUNNER_TEMP/cohort/asm2.$variant.rr3"
            out="$RUNNER_TEMP/cohort/asm2.$variant.out.fa"
            bash review/axis3/refrel3_adapter.sh build "$ref" "$variant" 2 "$asm" "$arc"
            bash review/axis3/refrel3_adapter.sh decode "$ref" "$arc" "$out"
            cmp "$asm" "$out"
            bash review/axis3/refrel3_adapter.sh info "$arc" > "$arc.info"
            case "$variant" in q4k) grep -Fq 'Q 4096' "$arc.info";; q16k) grep -Fq 'Q 16384' "$arc.info";; esac
            region='asm2:1001-5096'
            bash review/axis3/refrel3_adapter.sh region "$ref" "$arc" "$region" > "$arc.fetch"
            samtools faidx "$asm" "$region" > "$arc.truth"
            cmp "$arc.fetch" "$arc.truth"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("review/axis3/adapters/aceapex-refrel3.json").read_text())
          assert d["upstream_commit"] == "5b6d5cec0f5962a561ac48822a1b5c48793a5b47"
          assert d["freeze_status"] == "frozen-v1"
          assert d["measurements_allowed"] is False
          assert d["variants"]["q4k"]["Q_block"] == 4096
          assert d["variants"]["q16k"]["Q_block"] == 16384
          print("PASS: refrel3 frozen v1 q4k/q16k bit-perfect; enable gate satisfied by this run")
          PY
      - name: OpenZL v0.3.0 frame-27 contract gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("review/axis3/adapters/openzl-v030.json").read_text())
          assert d["upstream_commit"] == "32246b48faee46807f84183dac4db479089f5445"
          assert d["frame_format_version"] == 27
          assert d["measurements_allowed"] is False
          want={
            "l1_w64k":(1,16,65536),
            "l1_w1m":(1,20,1048576),
            "l3_w64k":(3,16,65536),
            "l3_w1m":(3,20,1048576),
          }
          for k,(level,wlog,wbytes) in want.items():
              v=d["variants"][k]
              assert (v["compression_level"],v["lz_window_log"],v["lz_window_bytes"]) == (level,wlog,wbytes)
          print("PASS: OpenZL v0.3.0 frame-27 variants are pinned and measurement-disabled")
          PY
          bash -n review/axis3/build_openzl_v030.sh
          bash -n review/axis3/openzl_adapter.sh
          # Fail closed: stock zli does not expose ZL_LzParam_windowLog. A synthetic
          # bit-perfect measurement gate is not satisfied until a parameterized graph
          # helper can prove both windowLog and round-trip for all four variants.
          export OPENZL_ZLI=/bin/false
          if bash review/axis3/openzl_adapter.sh build l1_w64k "$RUNNER_TEMP/cohort/asm1.fa" "$RUNNER_TEMP/x.zl"; then
            echo 'OpenZL adapter unexpectedly enabled before windowLog helper' >&2
            exit 1
          fi
      - name: Contracts and path hygiene
        run: |
          set -euo pipefail
          python3 -m py_compile review/axis3/generate_windows.py review/axis3/judge.py review/axis3/make_synthetic.py
          bash -n review/axis3/run_axis3_ace_core.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("review/axis3/adapters/aceapex-refrel3.json")
          d=json.loads(p.read_text())
          assert d["freeze_contract"] == "research/refrel/FORMAT.md"
          assert d["freeze_status"] == "frozen-v1"
          assert d["upstream_commit"] == "5b6d5cec0f5962a561ac48822a1b5c48793a5b47"
          assert d["variants"]["q4k"]["RR_BS"] == d["variants"]["q4k"]["Q_block"] == 4096
          assert d["variants"]["q16k"]["RR_BS"] == d["variants"]["q16k"]["Q_block"] == 16384
          print("PASS: refrel3 frozen-v1 contract pinned")
          PY
          if grep -R -F '/home/' review/axis3; then
            echo 'absolute /home path in axis3 source' >&2
            exit 1
          fi
