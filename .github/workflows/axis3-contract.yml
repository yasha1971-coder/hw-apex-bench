name: Axis 3 cohort contracts
on:
  pull_request:
    paths:
      - 'review/axis3/**'
      - '.github/workflows/axis3-contract.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fast syntax gate
        run: |
          set -euo pipefail
          python3 -m py_compile review/axis3/*.py
          for f in review/axis3/*.sh; do
            bash -n "$f"
          done
      - name: Install synthetic adapter dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq samtools tabix
      - name: Create three related mini assemblies
        run: |
          set -euo pipefail
          python3 review/axis3/make_synthetic.py "$RUNNER_TEMP/cohort"
          : > "$RUNNER_TEMP/cohort/manifest.tsv"
          printf 'assembly_id\tlocal_fasta\tsha256\n' >> "$RUNNER_TEMP/cohort/manifest.tsv"
          for f in "$RUNNER_TEMP"/cohort/asm*.fa; do
            samtools faidx "$f"
            id=$(basename "$f" .fa)
            h=$(sha256sum "$f" | cut -d' ' -f1)
            printf '%s\t%s\t%s\n' "$id" "$f" "$h" >> "$RUNNER_TEMP/cohort/manifest.tsv"
          done
      - name: Deterministic window contract and FASTA truth
        run: |
          set -euo pipefail
          for w in 256 4096 65536; do
            python3 review/axis3/generate_windows.py --manifest "$RUNNER_TEMP/cohort/manifest.tsv" --n all --window "$w" --out-prefix "$RUNNER_TEMP/cohort/w$w"
            python3 review/axis3/generate_windows.py --manifest "$RUNNER_TEMP/cohort/manifest.tsv" --n all --window "$w" --out-prefix "$RUNNER_TEMP/cohort/repeat$w"
            cmp "$RUNNER_TEMP/cohort/w$w.tsv" "$RUNNER_TEMP/cohort/repeat$w.tsv"
            cmp "$RUNNER_TEMP/cohort/w$w.sha256.tsv" "$RUNNER_TEMP/cohort/repeat$w.sha256.tsv"
          done
      - name: BGZF adapter bit-perfect synthetic windows
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/cohort/asm*.fa; do bgzip -c "$f" > "$f.bgz"; samtools faidx "$f.bgz"; done
          python3 - "$RUNNER_TEMP/cohort" <<'PY'
          import subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1]); req=root/"w4096.tsv"; out=root/"answers.hex"
          rows=[]
          for line in req.read_text().splitlines():
            if not line or line.startswith("#") or line.startswith("assembly_id"): continue
            a,c,s,e=line.split("\t")
            cp=subprocess.run(["samtools","faidx",str(root/(a+".fa.bgz")),f"{c}:{s}-{e}"],capture_output=True,check=True)
            seq=b"".join(x for x in cp.stdout.splitlines() if not x.startswith(b">"))
            rows.append(seq.hex())
          out.write_text("\n".join(rows)+"\n")
          PY
          python3 review/axis3/judge.py --references "$RUNNER_TEMP/cohort/w4096.sha256.tsv" --answers "$RUNNER_TEMP/cohort/answers.hex" --result "$RUNNER_TEMP/cohort/judge.json"
      - name: Two-bit capacity baseline on synthetic cohort
        run: |
          set -euo pipefail
          python3 review/axis3/two_bit_capacity.py "$RUNNER_TEMP/cohort" > "$RUNNER_TEMP/cohort/two-bit.json"
          grep -Fq '"status": "PASS"' "$RUNNER_TEMP/cohort/two-bit.json"
      - name: Judge must reject corruption
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/cohort/answers.hex" "$RUNNER_TEMP/cohort/bad.hex"
          sed -i '1s/^../00/' "$RUNNER_TEMP/cohort/bad.hex"
          if python3 review/axis3/judge.py --references "$RUNNER_TEMP/cohort/w4096.sha256.tsv" --answers "$RUNNER_TEMP/cohort/bad.hex" --result "$RUNNER_TEMP/cohort/bad.json"; then
            echo 'judge accepted corrupted answer' >&2
            exit 1
          fi
      - name: Refrel3 frozen-v1 q4k/q16k synthetic round-trip
        run: |
          set -euo pipefail
          bash review/axis3/build_refrel3.sh "$RUNNER_TEMP/refrel3"
          export RR3_BIN="$RUNNER_TEMP/refrel3/refrel3v1"
          ref="$RUNNER_TEMP/cohort/asm1.fa"
          for variant in q4k q16k; do
            asm="$RUNNER_TEMP/cohort/asm2.fa"
            arc="$RUNNER_TEMP/cohort/asm2.$variant.rr3"
            out="$RUNNER_TEMP/cohort/asm2.$variant.out.fa"
            bash review/axis3/refrel3_adapter.sh build "$ref" "$variant" 2 "$asm" "$arc"
            bash review/axis3/refrel3_adapter.sh decode "$ref" "$arc" "$out"
            cmp "$asm" "$out"
            bash review/axis3/refrel3_adapter.sh info "$arc" > "$arc.info"
            case "$variant" in q4k) grep -Fq 'Q 4096' "$arc.info";; q16k) grep -Fq 'Q 16384' "$arc.info";; esac
            region='asm2:1001-5096'
            bash review/axis3/refrel3_adapter.sh region "$ref" "$arc" "$region" > "$arc.fetch"
            samtools faidx "$asm" "$region" > "$arc.truth"
            python3 tools/cmp_bases.py --got "$arc.fetch" --want "$arc.truth" --variant "$variant" --expected-len 4096
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("review/axis3/adapters/aceapex-refrel3.json").read_text())
          assert d["upstream_commit"] == "5b6d5cec0f5962a561ac48822a1b5c48793a5b47"
          assert d["freeze_status"] == "frozen-v1"
          assert d["measurements_allowed"] is False
          assert d["variants"]["q4k"]["Q_block"] == 4096
          assert d["variants"]["q16k"]["Q_block"] == 16384
          print("PASS: refrel3 frozen v1 q4k/q16k bit-perfect; enable gate satisfied by this run")
          PY
      - name: OZSEG container unit tests without OpenZL
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,tempfile
          from pathlib import Path
          import importlib.util
          p=Path("review/axis3/openzl_segmented.py")
          spec=importlib.util.spec_from_file_location("oz",p);oz=importlib.util.module_from_spec(spec);spec.loader.exec_module(oz)
          def pack(frames):
              meta={"schema":"openzl-segmented-v1","variant":"mock","level":1,"windowLog":16,"lz_window_bytes":65536,"Q":4,"uncompressed_bases":sum(len(x) for x in frames),"contigs":[],"frames":[]}
              data=bytearray();u=0
              for x in frames:
                  meta["frames"].append({"uoff":u,"ulen":len(x),"coff":len(data),"clen":len(x)});data+=x;u+=len(x)
              m=json.dumps(meta,separators=(",",":"),sort_keys=True).encode()
              return b"OZSEG1\n"+bytes([1])+len(m).to_bytes(8,"little")+hashlib.sha256(m).digest()+m+data
          cases={"zero":[],"one":[b"ABCD"],"three":[b"ABCD",b"EFGH",b"I"],"empty_input":[],"exact_q":[b"ABCD",b"EFGH"]}
          with tempfile.TemporaryDirectory() as td:
              for name,frames in cases.items():
                  fn=Path(td)/name;fn.write_bytes(pack(frames))
                  f,m,base=oz.openarc(fn)
                  assert len(m["frames"])==len(frames)
                  got=[(x["uoff"],x["ulen"],x["coff"],x["clen"]) for x in m["frames"]]
                  print(name,"size",fn.stat().st_size,"header",fn.read_bytes()[:32].hex(" "),"frames",got)
          PY
      - name: OpenZL v0.3.0 segmented random-access synthetic round-trip
        run: |
          set -euo pipefail
          bash review/axis3/build_openzl_v030.sh "$RUNNER_TEMP/openzl"
          export OPENZL_HELPER="$RUNNER_TEMP/openzl/openzl-lz-helper"
          src="$RUNNER_TEMP/cohort/asm1.fa"
          for variant in l1_w64k l1_w1m l3_w64k l3_w1m; do
            arc="$RUNNER_TEMP/cohort/$variant.ozseg"
            out="$RUNNER_TEMP/cohort/$variant.out.bases"
            bash review/axis3/openzl_adapter.sh build "$variant" "$src" "$arc"
            printf 'writer_path=%s writer_size=%s\n' "$arc" "$(stat -c %s "$arc")"
            xxd -l 32 "$arc"
            reader_path="$arc"
            printf 'reader_path=%s reader_size=%s\n' "$reader_path" "$(stat -c %s "$reader_path")"
            xxd -l 32 "$reader_path"
            bash review/axis3/openzl_adapter.sh decode "$reader_path" "$out"
            samtools faidx "$src" asm1 | tail -n +2 | tr -d '\n\r' > "$out.truth"
            cmp "$out" "$out.truth"
            region='asm1:1001-66536'
            bash review/axis3/openzl_adapter.sh fetch "$arc" "$region" > "$out.fetch"
            samtools faidx "$src" "$region" | tail -n +2 | tr -d '\n\r' > "$out.fetch.truth"
            cmp "$out.fetch" "$out.fetch.truth"
            bash review/axis3/openzl_adapter.sh info "$arc" > "$arc.info"
            case "$variant" in
              l1_w64k) grep -Fq '"Q":65536' "$arc.info"; grep -Fq '"windowLog":16' "$arc.info";;
              l1_w1m) grep -Fq '"Q":1048576' "$arc.info"; grep -Fq '"windowLog":20' "$arc.info";;
              l3_w64k) grep -Fq '"Q":65536' "$arc.info"; grep -Fq '"windowLog":16' "$arc.info";;
              l3_w1m) grep -Fq '"Q":1048576' "$arc.info"; grep -Fq '"windowLog":20' "$arc.info";;
            esac
          done
      - name: OpenZL regression assembly larger than 1.6 GiB
        run: |
          set -euo pipefail
          export OPENZL_HELPER="$RUNNER_TEMP/openzl/openzl-lz-helper"
          big="$RUNNER_TEMP/big.fa"
          python3 - "$big" <<'PY'
          import sys
          p=sys.argv[1]; block=(b"ACGT"*(1024*1024//4))
          with open(p,"wb") as f:
              f.write(b">big\n")
              for _ in range(1640): f.write(block+b"\n")
          PY
          test "$(stat -c %s "$big")" -gt 1717986918
          samtools faidx "$big"
          arc="$RUNNER_TEMP/big.l1_w1m.ozseg"; out="$RUNNER_TEMP/big.out"
          bash review/axis3/openzl_adapter.sh build l1_w1m "$big" "$arc"
          bash review/axis3/openzl_adapter.sh decode "$arc" "$out"
          got=$(sha256sum "$out" | cut -d' ' -f1)
          want=$(samtools faidx "$big" big | tail -n +2 | tr -d '\n\r' | sha256sum | cut -d' ' -f1)
          test "$got" = "$want"
          region='big:1717000001-1717065536'
          bash review/axis3/openzl_adapter.sh fetch "$arc" "$region" > "$RUNNER_TEMP/big.fetch"
          samtools faidx "$big" "$region" | tail -n +2 | tr -d '\n\r' > "$RUNNER_TEMP/big.truth"
          cmp "$RUNNER_TEMP/big.fetch" "$RUNNER_TEMP/big.truth"
      - name: Contracts and path hygiene
        run: |
          set -euo pipefail
          python3 -m py_compile review/axis3/generate_windows.py review/axis3/judge.py review/axis3/make_synthetic.py review/axis3/openzl_segmented.py tools/cmp_bases.py
          bash -n review/axis3/run_axis3_ace_core.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("review/axis3/adapters/aceapex-refrel3.json")
          d=json.loads(p.read_text())
          assert d["freeze_contract"] == "research/refrel/FORMAT.md"
          assert d["freeze_status"] == "frozen-v1"
          assert d["upstream_commit"] == "5b6d5cec0f5962a561ac48822a1b5c48793a5b47"
          assert d["variants"]["q4k"]["RR_BS"] == d["variants"]["q4k"]["Q_block"] == 4096
          assert d["variants"]["q16k"]["RR_BS"] == d["variants"]["q16k"]["Q_block"] == 16384
          print("PASS: refrel3 frozen-v1 contract pinned")
          PY
          if grep -R -F '/home/' review/axis3; then
            echo 'absolute /home path in axis3 source' >&2
            exit 1
          fi
